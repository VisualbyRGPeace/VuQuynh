<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chi tiêu</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .card-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
        }

        .add-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .add-box h2 {
            margin-top: 0;
        }

        .inputs {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            background: #111;
            color: white;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #fafafa;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            .inputs {
                flex-direction: column;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <h1>QUẢN LÝ CHI TIÊU</h1>

    <div class="summary">

        <div class="card">
            <div class="card-title">Hạn mức</div>
            <div class="card-value">0đ</div>
        </div>

        <div class="card">
            <div class="card-title">Đã chi</div>
            <div class="card-value">0đ</div>
        </div>

        <div class="card">
            <div class="card-title">Còn lại</div>
            <div class="card-value">0đ</div>
        </div>

        <div class="card">
            <div class="card-title">Còn lại / ngày</div>
            <div class="card-value">0đ</div>
        </div>

    </div>


    <div class="add-box">

        <h2>Thêm khoản chi</h2>

        <div class="inputs">

            <input
                type="text"
                placeholder="Tên khoản chi"
            >

            <input
                type="number"
                placeholder="Số tiền"
            >

            <input
                type="date"
            >

            <button>
                + Thêm
            </button>

        </div>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>Ngày</th>
                    <th>Khoản chi</th>
                    <th>Số tiền</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td colspan="3" class="empty">
                        Chưa có khoản chi nào
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
